# ~/.config/hypr/userprefs.conf
# -----------------------------------------------------
# i3 / Sway / Aerospace muscle memory for Omarchy
# -----------------------------------------------------
# Installed by omarchy/install.sh, which appends a `source =` line for this
# file to the BOTTOM of ~/.config/hypr/hyprland.conf, so everything in here
# wins over the Omarchy defaults.
#
# install.sh also generates ~/.config/hypr/omarchy-unbind.conf (sourced just
# before this file), which contains an `unbind` line for every Omarchy default
# bind that collides with a bind below. That file is regenerated from the
# actual Omarchy config on the machine, so it stays correct across Omarchy
# updates -- re-run install.sh after a big `omarchy-update`.
#
# =====================================================================
# ANSWERS TO THE QUESTIONS IN THE FIRST DRAFT OF THIS FILE
# =====================================================================
#
# Q: "$mainMod = ALT" -- is that how I get the Mac Option key to be my mod?
# A: No, don't do it that way. Two problems:
#      1. Hyprland expands variables at PARSE time, top to bottom. The Omarchy
#         defaults are sourced before this file and were already parsed with
#         $mainMod = SUPER. Redefining it here only affects the lines below it,
#         so `unbind = $mainMod, Return` would have unbound ALT+Return -- a bind
#         that never existed -- and every Omarchy SUPER default would have
#         survived and fought with the new ALT binds.
#      2. It only fixes Hyprland. Waybar, the terminal, the Omarchy menu and
#         every other app would still see the raw Option key as Alt.
#    Instead we swap Alt and Super at the KEYBOARD LAYOUT level, in
#    hypr/input.conf (`kb_options = altwin:swap_alt_win`). The physical Option
#    key then emits Super and the physical Command key emits Alt, system-wide.
#    That is the same physical position as the Windows key on a PC keyboard,
#    which is exactly the muscle memory you asked for -- and it answers the
#    "please also map the alt key to Command on macOS" request in one shot.
#    $mainMod stays SUPER, every Omarchy default keeps working, and on PC
#    hardware you just comment out one line in install.sh (MAC_KEYBOARD=false).
#
# Q: "Maybe we can comment this out since Super-Enter already launches the
#     terminal by default in Omarchy?"
# A: It would have been, right up until you changed the default terminal.
#    Omarchy binds SUPER+Return to its own $terminal variable, and that
#    variable can't be usefully overridden from here -- same parse-order
#    problem as $mainMod: the default bindings were already expanded with the
#    old value long before this file is read. So the bind is back, pointed
#    straight at Foot -- install.sh fills in the placeholder below, adding the
#    uwsm wrapper if Omarchy uses one.
#
#    (Foot, not Ghostty: Ghostty has no aarch64 repo package and no upstream
#    Linux binary release, so on the M4 it would have meant a from-source Zig
#    build. Foot is in the repos on both arches and is the lighter option on
#    the 2011 hardware. Tabs and splits come from tmux instead.)
#
# Q: "Is this the Omarchy launcher? If not, let us please bind the Omarchy
#     launcher to Option-D."
# A: rofi is not installed on Omarchy -- the launcher is Walker, normally on
#    SUPER+Space. install.sh reads the real launcher command out of the Omarchy
#    config at install time and substitutes it below, so Option+D fires the
#    genuine Omarchy launcher (with its uwsm wrapper intact) and SUPER+Space
#    keeps working too.

# -----------------------------------------------------
# 0. Main modifier
# -----------------------------------------------------
# Stays SUPER. On Mac hardware the Alt/Super swap in input.conf means this is
# physically the Option key; on PC hardware it is the Windows key. Same spot
# on the keyboard either way.
$mainMod = SUPER

# -----------------------------------------------------
# 1. App launchers (i3/Sway style)
# -----------------------------------------------------
# i3's $mod+d. install.sh substitutes the placeholder below with the launcher
# command Omarchy actually uses on this machine.
bind = $mainMod, D, exec, @LAUNCHER@

# i3's $mod+Return -- terminal. Pointed at Foot rather than Omarchy's
# $terminal; install.sh substitutes the real command.
bind = $mainMod, Return, exec, @TERMINAL@

# Tell everything Hyprland launches which terminal to shell out to. Applied at
# Hyprland startup, not on `hyprctl reload`, so this one needs a re-login.
env = TERMINAL,foot

# Browser: already SUPER+B in Omarchy (Chromium). Uncomment only to override.
# bind = $mainMod, B, exec, chromium

# -----------------------------------------------------
# 2. i3-style window focus directionals (HJKL)
# -----------------------------------------------------
bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r

# -----------------------------------------------------
# 3. Workspace switchers (1 to 10)
# -----------------------------------------------------
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# -----------------------------------------------------
# 4. Move active window to workspace (mod + Shift + 1-10)
# -----------------------------------------------------
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# -----------------------------------------------------
# 5. i3-style window shifting (mod + Shift + HJKL)
# -----------------------------------------------------
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, L, movewindow, r

# -----------------------------------------------------
# 6. i3-style back-and-forth engine
# -----------------------------------------------------
binds {
    # Pressing the active workspace's key again bounces to the previous one
    workspace_back_and_forth = true

    # Keeps the workspace history stack so `workspace, previous` works
    allow_workspace_cycles = true
}

# -----------------------------------------------------
# 7. Dedicated back-and-forth toggle
# -----------------------------------------------------
bind = $mainMod, Tab, workspace, previous

# =====================================================================
# 8. The rest of the i3 defaults you didn't list but will reach for
# =====================================================================
# This whole section is additive suggestions -- comment out anything that
# fights an Omarchy default you'd rather keep. (install.sh writes every
# Omarchy bind it displaced to ~/.config/hypr/DISPLACED-BINDS.txt so you can
# see exactly what you gave up and put it back on another key.)

# i3 $mod+Shift+q -- close window. Omarchy's SUPER+W still works too.
bind = $mainMod SHIFT, Q, killactive,

# i3 $mod+f -- fullscreen
bind = $mainMod, F, fullscreen, 0

# i3 $mod+Shift+space -- toggle floating
bind = $mainMod SHIFT, SPACE, togglefloating,

# i3 $mod+Shift+c -- reload the config in place
bind = $mainMod SHIFT, C, exec, hyprctl reload

# i3 $mod+r -- resize mode. HJKL or arrows to resize, Escape/Enter to leave.
bind = $mainMod, R, submap, resize
submap = resize
binde = , H, resizeactive, -40 0
binde = , J, resizeactive, 0 40
binde = , K, resizeactive, 0 -40
binde = , L, resizeactive, 40 0
binde = , left, resizeactive, -40 0
binde = , down, resizeactive, 0 40
binde = , up, resizeactive, 0 -40
binde = , right, resizeactive, 40 0
bind = , escape, submap, reset
bind = , Return, submap, reset
submap = reset
# NOTE: `submap = reset` above is mandatory -- without it every bind parsed
# after this point would land inside the resize submap instead of globally.
