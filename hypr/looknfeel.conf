# ~/.config/hypr/looknfeel.conf
# Tight gaps + thin borders.
#
# NOTE: this is the hyprlang (Omarchy 3 and earlier) version. Omarchy 4
# ("quattro") moved Hyprland to its Lua config format, and there the same
# settings live in hypr/looknfeel.lua. install.sh looks at the machine and
# installs whichever of the two that Omarchy actually reads -- this file is
# only used on a box still running the .conf-based Omarchy.
#
# Colors are deliberately left out so the Omarchy theme system keeps control of
# them (that's the one thing you still want to set from the app menu).

general {
    gaps_in = 1
    gaps_out = 2
    border_size = 1
}
