# ~/.config/hypr/input.conf
# -----------------------------------------------------
# Mac keyboard: swap Alt and Super at the layout level
# -----------------------------------------------------
# On a Mac keyboard the bottom row reads Control / Option / Command.
# On a PC keyboard it reads Control / Super(Win) / Alt.
# So the key sitting in the PC "Super" position on a Mac is Option, and the key
# in the PC "Alt" position is Command.
#
# altwin:swap_alt_win swaps the two, which makes the physical Option key emit
# Super and the physical Command key emit Alt. Result: $mainMod = SUPER binds
# fire from Option, exactly like the Windows key does on a PC and exactly like
# your Aerospace setup -- and it applies system-wide (Waybar, the terminal, every
# app), not just to Hyprland binds.
#
# Set MAC_KEYBOARD=false in install.sh on PC hardware and this file is skipped
# entirely; Omarchy's own input.conf is left alone.

input {
    kb_options = altwin:swap_alt_win
}
